<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Instagram Gradient -->
    <radialGradient id="instagramGradient" cx="30%" cy="110%">
      <stop offset="0%" style="stop-color:#FFD521;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#F7A11B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E1306C;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#C13584;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5851DB;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect width="200" height="200" rx="20" fill="url(#instagramGradient)"/>
  
  <!-- Instagram Camera Icon -->
  <!-- Outer rounded square -->
  <rect x="50" y="50" width="100" height="100" rx="22" fill="none" stroke="white" stroke-width="12"/>
  
  <!-- Inner circle (lens) -->
  <circle cx="100" cy="100" r="25" fill="none" stroke="white" stroke-width="12"/>
  
  <!-- Small circle (flash) -->
  <circle cx="135" cy="65" r="8" fill="white"/>
</svg>
